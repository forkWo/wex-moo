name: Wex JSON Upload

on:
  push:
    branches:
  #   - main
  workflow_dispatch:
  schedule:
#    - cron: '*/45 * * * *'

env:
  ORIGINAL_JSON: "aiwex.json"
  ORIGINAL_URL: "https://9280.kstore.space/aiwex.json"
  FINAL_JSON: "wex.json"         # 不修改Emby
  FINAL_JSON_ME: "wexme.json"    # 含Emby多配置
  SWITCH_DOUBAN: ${{ secrets.SWITCH_DOUBAN }}
  #推荐链接
  DOUBAN_ext: ${{ secrets.DOUBAN_ext }}
  #需要删除的
  key_DELETE: ${{ secrets.key_DELETE }}
  #凯速路径
  KSTORE_ID: ${{ secrets.KSTORE_ID }}
  #凯速密钥
  KSTORE_TOKEN: ${{ secrets.KSTORE_TOKEN }}
  # 从环境变量获取Emby数量配置
  # 0=删除全部Emby  1=保留第一个Emby  2+=新建N个Emby
  EMBY_COUNT: ${{ secrets.EMBY_COUNT }}
  # 添加事件类型环境变量
  EVENT_TYPE: ${{ github.event_name }}

jobs:
  modify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 安装系统依赖
        run: |
          sudo apt-get install -y jq curl

      - name: 清理历史记录
        run: |
          set -euo pipefail
          RUNS=$(curl -sLf --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" || true)
          OLD_RUNS=$(echo "$RUNS" | jq -r '.workflow_runs | sort_by(.run_number) | reverse | .[1:] | map(select(.status == "completed")) | .[] | .id' 2>/dev/null)
          [ -n "$OLD_RUNS" ] && echo "🗑️ 清理历史记录" && echo "$OLD_RUNS" | xargs -I{} curl -sLf -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/runs/{}"

      - name: 下载原始JSON数据
        run: |
          set -euxo pipefail
          curl -fsSL --retry 1 -o ${{ env.ORIGINAL_JSON }} "${{ env.ORIGINAL_URL }}"
          jq empty ${{ env.ORIGINAL_JSON }}

      - name: 提取Spider内容
        if: github.event_name != 'workflow_dispatch'
        id: spider
        run: |
          set -euxo pipefail
          SPIDER_CONTENT=$(jq -e -r '.spider // "" | gsub("\n"; "\\n")' ${{ env.ORIGINAL_JSON }})
          echo "SPIDER_CONTENT=$SPIDER_CONTENT" >> $GITHUB_ENV

      - name: 获取历史Spider
        if: github.event_name != 'workflow_dispatch'
        id: history
        run: |
          set -euxo pipefail
          RESP=$(curl -sfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" || true)
          
          PREVIOUS_SPIDER=$(jq -r '
            if .message == "Not Found" then
              "no_history"
            else
              (.body | split("Spider内容: ")[1] // "")
            end' <<< "$RESP")

          echo "PREVIOUS_SPIDER=$PREVIOUS_SPIDER" >> $GITHUB_ENV

      - name: 内容对比
        id: comparator
        run: |
          set -euxo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            if [[ "$SPIDER_CONTENT" != "$PREVIOUS_SPIDER" ]]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 处理JSON数据（生成wex.json和wexme.json）
        if: steps.comparator.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          python3 <<'PYEOF'
          import json
          import os
          import copy
          import re
          from datetime import datetime, timezone, timedelta

          INPUT_FILE = os.environ.get("ORIGINAL_JSON", "aiwex.json")
          OUTPUT_FILE_WEX = os.environ.get("FINAL_JSON", "wex.json")
          OUTPUT_FILE_WEXME = os.environ.get("FINAL_JSON_ME", "wexme.json")

          # 解析EMBY_COUNT：无配置/非数字视为0
          emby_count_str = os.environ.get("EMBY_COUNT", "")
          try:
              emby_count = int(emby_count_str) if emby_count_str else 0
          except ValueError:
              print("⚠️ EMBY_COUNT不是有效数字，视为0")
              emby_count = 0

          NAME_MAPPING = {
              "Douban": "🐮【推荐】🐮",
              "Wexokconfig": "🐮配置中心🐮",
              "Wexnullname": "💓观影┃4K💓",
              "push_agent": "推送"
          }

          PRIORITY_MAP = {
              "Douban": 1,
              "Wexokconfig": 2,
              "玩偶": 3
          }

          # Emby key 匹配规则：兼容 Wexemby / Emby / Emby001 / Wexdiyemby001 等
          EMBY_KEY_PATTERN = re.compile(r'^(Wex)?(diy)?[Ee]mby\d*$', re.IGNORECASE)

          def is_emby_key(key):
              """判断是否为 Emby 相关站点 key"""
              if not key:
                  return False
              return bool(EMBY_KEY_PATTERN.match(key))

          def build_emby_sites(count, insert_index):
              """构建 N 个新的 Emby DIY 配置"""
              sites = []
              for i in range(1, count + 1):
                  sites.append({
                      "key": f"Emby{str(i).zfill(3)}",
                      "name": f"💓Emby{i}┃4K💓",
                      "type": 3,
                      "api": "csp_EmbyDiyGuard",
                      "searchable": 1,
                      "quickSearch": 1,
                      "changeable": 0,
                      "ext": {
                          "embynumber": i - 1
                      }
                  })
              print(f"🆕 新建 {count} 个 Emby 配置（Emby001~Emby{str(count).zfill(3)}），插入位置：{insert_index}")
              return sites

          key_delete = json.loads(os.environ.get("key_DELETE", "[]"))
          switch_douban = os.environ.get("SWITCH_DOUBAN", "false").lower() == "true"
          douban_ext = os.environ.get("DOUBAN_ext", "")
          event_type = os.environ.get("EVENT_TYPE", "")

          special_mods = {}
          if switch_douban and douban_ext:
              special_mods["Douban"] = {
                  "name": NAME_MAPPING.get("Douban", "Douban"),
                  "ext": douban_ext
              }

          try:
              with open(INPUT_FILE, "r", encoding="utf-8") as f:
                  original_data = json.load(f)

              data_wex = copy.deepcopy(original_data)
              data_wexme = copy.deepcopy(original_data)

              def process_data(data, process_emby):
                  # 处理proxy规则（通用）
                  if "rules" in data:
                      for rule in data["rules"]:
                          if rule.get("name") == "proxy" and "hosts" in rule:
                              if "hdhive.online" not in rule["hosts"]:
                                  rule["hosts"].append("hdhive.online")
                                  print("✅ 已添加 hdhive.online 到proxy规则的hosts中")
                          elif rule.get("name") == "proxy" and "pattern" in rule:
                              if not any("hdhive.online" in p for p in rule["pattern"]):
                                  rule["pattern"].append("hdhive.online")
                                  print("✅ 已添加 hdhive.online 到proxy规则的pattern中")

                  # 移除冗余字段（通用）
                  data.pop("doh", None)
                  data.pop("lives", None)

                  sites = data.get("sites", [])

                  # ===== Emby 处理（核心逻辑）=====
                  if process_emby:
                      # 收集所有 Emby 站点及其位置
                      emby_entries = []
                      non_emby_sites = []
                      for idx, site in enumerate(sites):
                          if is_emby_key(site.get("key")):
                              emby_entries.append((idx, site))
                          else:
                              non_emby_sites.append(site)

                      emby_keys_found = [s.get("key") for _, s in emby_entries]
                      print(f"🔍 发现 {len(emby_entries)} 个 Emby 站点：{emby_keys_found}")

                      if emby_count == 0:
                          # 0 → 删除全部 Emby
                          print(f"🗑️ EMBY_COUNT=0，删除全部 {len(emby_entries)} 个 Emby 站点")
                          sites = non_emby_sites

                      elif emby_count == 1:
                          # 1 → 仅保留第一个 Emby，删除其余
                          if emby_entries:
                              keep_idx, keep_site = emby_entries[0]
                              print(f"✅ EMBY_COUNT=1，保留第一个 Emby：{keep_site.get('key')}，删除其余 {len(emby_entries)-1} 个")
                              sites = non_emby_sites[:]
                              sites.insert(keep_idx, keep_site)
                          else:
                              sites = non_emby_sites

                      else:
                          # ≥2 → 删除全部原始 Emby，在第一个位置新建 N 个
                          insert_index = emby_entries[0][0] if emby_entries else len(non_emby_sites)
                          print(f"🔄 EMBY_COUNT={emby_count}，删除全部原始 Emby，在位置 {insert_index} 新建 {emby_count} 个")
                          new_embys = build_emby_sites(emby_count, insert_index)
                          sites = non_emby_sites[:]
                          for emb in reversed(new_embys):
                              sites.insert(insert_index, emb)
                  # ===== Emby 处理结束 =====

                  # 单独处理push_agent和Wexconfig（暂存后重新添加，确保位置在最后）
                  processed_sites = []
                  push_agent = None
                  wexconfig = None
                  for site in sites:
                      key = site.get("key")
                      if key == "push_agent":
                          push_agent = site
                          continue
                      if key == "Wexconfig":
                          wexconfig = site
                          continue
                      processed_sites.append(site)

                  # 应用名称映射和特殊修改
                  final_sites = []
                  for site in processed_sites:
                      key = site.get("key")
                      # 过滤需要删除的key
                      if key in key_delete:
                          continue
                      # 应用特殊修改
                      if key in special_mods:
                          site.update(special_mods[key])
                      # 名称映射处理
                      if key in NAME_MAPPING:
                          new_name = NAME_MAPPING[key]
                          if key == "push_agent":
                              if event_type != "workflow_dispatch":
                                  current_date = datetime.now(timezone(timedelta(hours=8))).strftime("%-m.%d")
                                  new_name += current_date
                          site["name"] = new_name
                      final_sites.append(site)

                  # 按优先级排序
                  final_sites.sort(key=lambda x: PRIORITY_MAP.get(x.get("key"), 4))

                  # 最后添加Wexconfig和push_agent
                  if wexconfig:
                      final_sites.append(wexconfig)

                  if push_agent:
                      if push_agent.get("key") == "push_agent":
                          base_name = NAME_MAPPING.get("push_agent", "推送")
                          if event_type != "workflow_dispatch":
                              current_date = datetime.now(timezone(timedelta(hours=8))).strftime("%-m.%d")
                              push_agent["name"] = base_name + current_date
                          else:
                              push_agent["name"] = base_name
                      final_sites.append(push_agent)

                  data["sites"] = final_sites
                  return data

              # 生成wex.json（不处理Emby，process_emby=False）
              data_wex_processed = process_data(data_wex, process_emby=False)
              with open(OUTPUT_FILE_WEX, "w", encoding="utf-8") as f:
                  json.dump(data_wex_processed, f, ensure_ascii=False, indent=2, sort_keys=False)
              print(f"✅ 生成 {OUTPUT_FILE_WEX}（不修改Emby）")

              # 生成wexme.json（处理Emby，process_emby=True）
              data_wexme_processed = process_data(data_wexme, process_emby=True)
              with open(OUTPUT_FILE_WEXME, "w", encoding="utf-8") as f:
                  json.dump(data_wexme_processed, f, ensure_ascii=False, indent=2, sort_keys=False)
              print(f"✅ 生成 {OUTPUT_FILE_WEXME}（含Emby多配置，EMBY_COUNT={emby_count}）")

          except json.JSONDecodeError as e:
              print(f"❌ JSON解析错误: {e}")
              exit(1)
          except Exception as e:
              print(f"❌ 处理失败: {str(e)}")
              exit(1)
          PYEOF

      - name: 上传至凯速平台（两个文件）
        if: steps.comparator.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          # 上传wex.json（不修改Emby）
          echo "📤 上传 ${{ env.FINAL_JSON }} 至凯速平台"
          curl -sSf --retry 3 \
            -F "file=@${{ env.FINAL_JSON }}" \
            "https://upload.kstore.space/upload/${{ secrets.KSTORE_ID }}?access_token=${{ secrets.KSTORE_TOKEN }}"
          
          # 上传wexme.json（含Emby多配置）
          echo "📤 上传 ${{ env.FINAL_JSON_ME }} 至凯速平台"
          curl -sSf --retry 3 \
            -F "file=@${{ env.FINAL_JSON_ME }}" \
            "https://upload.kstore.space/upload/${{ secrets.KSTORE_ID }}?access_token=${{ secrets.KSTORE_TOKEN }}"

      - name: 创建版本发布
        if: steps.comparator.outputs.changed == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          set -euxo pipefail
          TIMESTAMP=$(date +%s)
          gh release create "v$TIMESTAMP" \
            --title "$(date +%F)" \
            --notes "Spider内容: $SPIDER_CONTENT" \
            ${{ env.FINAL_JSON }} ${{ env.FINAL_JSON_ME }} \
            --target ${{ github.sha }}
